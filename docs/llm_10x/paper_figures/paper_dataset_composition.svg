<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#f8fafc"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif; }
  </style>
<text x="48" y="58" font-size="29" font-weight="800" fill="#0f172a">Figure 2. 이 실험은 어떤 언어/문자 분포를 학습하는가?</text>
<text x="48" y="88" font-size="15" fill="#475569">질문: 한글 tokenizer 논의를 이 데이터셋에 그대로 적용할 수 있는가?</text>
<text x="70" y="141" font-size="18" font-weight="700" fill="#0f172a">train</text>
<rect x="210.0" y="117" width="42.7" height="34" fill="#2563eb" opacity="0.9"/>
<rect x="252.7" y="117" width="508.7" height="34" fill="#059669" opacity="0.9"/>
<text x="260.7" y="140" font-size="12" fill="#ffffff">ASCII 74.8%</text>
<rect x="761.4" y="117" width="46.3" height="34" fill="#f59e0b" opacity="0.9"/>
<rect x="807.7" y="117" width="82.3" height="34" fill="#7c3aed" opacity="0.9"/>
<text x="920" y="141" font-size="14" fill="#334155">14,898,445 문자</text>
<text x="70" y="259" font-size="18" font-weight="700" fill="#0f172a">validation</text>
<rect x="210.0" y="235" width="43.3" height="34" fill="#2563eb" opacity="0.9"/>
<rect x="253.3" y="235" width="507.9" height="34" fill="#059669" opacity="0.9"/>
<text x="261.3" y="258" font-size="12" fill="#ffffff">ASCII 74.7%</text>
<rect x="761.1" y="235" width="43.9" height="34" fill="#f59e0b" opacity="0.9"/>
<rect x="805.0" y="235" width="85.0" height="34" fill="#7c3aed" opacity="0.9"/>
<text x="920" y="259" font-size="14" fill="#334155">1,321,972 문자</text>
<rect x="70" y="360" width="16" height="16" rx="3" fill="#2563eb"/>
<text x="94" y="373" font-size="14" fill="#334155">한글</text>
<rect x="202" y="360" width="16" height="16" rx="3" fill="#059669"/>
<text x="226" y="373" font-size="14" fill="#334155">ASCII</text>
<rect x="334" y="360" width="16" height="16" rx="3" fill="#f59e0b"/>
<text x="358" y="373" font-size="14" fill="#334155">숫자</text>
<rect x="466" y="360" width="16" height="16" rx="3" fill="#7c3aed"/>
<text x="490" y="373" font-size="14" fill="#334155">기호/기타</text>
<rect x="48" y="430" width="1004" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="70" y="462" font-size="15" fill="#1e3a8a">관찰: train과 validation 모두 한글은 약 6%대이고, ASCII가 약 75%다.</text>
<text x="70" y="488" font-size="15" fill="#1e3a8a">해석: 이 실험의 주 결론은 한글 전용 tokenizer가 아니라 영어/코드/LLM 자료 중심 혼합 corpus tokenizer에 대한 결론이다.</text>
</svg>
