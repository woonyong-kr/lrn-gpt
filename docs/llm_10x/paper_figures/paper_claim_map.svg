<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#f8fafc"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif; }
  </style>
<text x="48" y="58" font-size="30" font-weight="800" fill="#0f172a">LLM 10x 실험의 현재 결론 지도</text>
<text x="48" y="91" font-size="16" fill="#475569">이 그림은 최종 결론이 아니라, screen-ready 조건에서 지금 말할 수 있는 주장과 보류해야 할 주장을 분리한다.</text>
<rect x="48" y="130" width="500" height="155" rx="8" fill="#ffffff" stroke="#d8dee8"/>
<rect x="48" y="130" width="6" height="155" rx="3" fill="#2563eb"/>
<text x="70" y="162" font-size="19" font-weight="700" fill="#0f172a">기준 데이터셋</text>
<text x="70" y="194" font-size="15" fill="#334155">1,601개 문서, 4,828개 chunk</text>
<text x="70" y="219" font-size="15" fill="#334155">train 14,898,445 문자, 공백 기준 1,194,327 단어</text>
<text x="70" y="244" font-size="15" fill="#334155">한글 비중 6.28%, ASCII 비중 74.80%</text>
<rect x="590" y="130" width="452" height="155" rx="8" fill="#ffffff" stroke="#d8dee8"/>
<rect x="590" y="130" width="6" height="155" rx="3" fill="#059669"/>
<text x="612" y="162" font-size="19" font-weight="700" fill="#0f172a">현재 최상위 조건</text>
<text x="612" y="194" font-size="15" fill="#334155">CTX0256: validation bits/char 3.60530</text>
<text x="612" y="219" font-size="15" fill="#334155">단, claim-ready 반복 수에는 아직 도달하지 않음</text>
<text x="612" y="244" font-size="15" fill="#334155">따라서 실험 우선순위용 결론으로 제한</text>
<rect x="48" y="330" width="500" height="155" rx="8" fill="#ffffff" stroke="#d8dee8"/>
<rect x="48" y="330" width="6" height="155" rx="3" fill="#ea580c"/>
<text x="70" y="362" font-size="19" font-weight="700" fill="#0f172a">Vocab 해석</text>
<text x="70" y="394" font-size="15" fill="#334155">6000 -&gt; 10000에서 validation bits/char는 개선</text>
<text x="70" y="419" font-size="15" fill="#334155">하지만 V10000의 20회 이하 type은 592개</text>
<text x="70" y="444" font-size="15" fill="#334155">압축 이득과 tail token 위험을 함께 판단해야 함</text>
<rect x="590" y="330" width="452" height="155" rx="8" fill="#ffffff" stroke="#d8dee8"/>
<rect x="590" y="330" width="6" height="155" rx="3" fill="#7c3aed"/>
<text x="612" y="362" font-size="19" font-weight="700" fill="#0f172a">말하면 안 되는 결론</text>
<text x="612" y="394" font-size="15" fill="#334155">큰 vocab일수록 무조건 좋다</text>
<text x="612" y="419" font-size="15" fill="#334155">NSMC 결과가 Obsidian LLM 10x를 대체한다</text>
<text x="612" y="444" font-size="15" fill="#334155">token-level loss만으로 tokenizer를 비교한다</text>
</svg>
