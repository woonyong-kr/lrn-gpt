<polyline points="635.0,410.3 820.0,324.2 1005.0,189.7" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="622" y="515" font-size="15" font-weight="700" fill="#9a3412">risk 관찰: rare/tail type도 함께 늘어난다.</text>
<rect x="48" y="545" width="1004" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
<text x="70" y="576" font-size="15" fill="#9a3412">결론: V10000은 유망하지만, 더 큰 vocab 권고 전에는 tail token, top-token 쏠림, validation gap을 같이 확인해야 한다.</text>
