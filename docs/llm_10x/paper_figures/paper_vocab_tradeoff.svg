<polyline points="105.0,189.7 290.0,341.1 475.0,410.3" fill="none" stroke="#059669" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="92" y="515" font-size="15" font-weight="700" fill="#065f46">loss 관찰: V6000 -> V10000은 좋아진다.</text>
<line x1="610" y1="150" x2="610" y2="450" stroke="#94a3b8"/>
<line x1="610" y1="450" x2="1030" y2="450" stroke="#94a3b8"/>
